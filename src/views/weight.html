<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Converter</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main>
        <h1>⚖️ Weight Converter</h1>

        <p class="subtitle">
            Let's make those numbers lighter! 🌸
        </p>
        <form action="/weight" method="POST">
            <label for="value">Value</label>

            <input type="number" id="value" name="value" step="any" required>

            <label for="from">Convert from</label>

            <select id="from" name="from">
                <option value="milligram">Milligram</option>
                <option value="gram">Gram</option>
                <option value="kilogram">Kilogram</option>
                <option value="ounce">Ounce</option>
                <option value="pound">Pound</option>
            </select>

            <label for="to">Convert to</label>

            <select id="to" name="to">
                <option value="milligram">Milligram</option>
                <option value="gram">Gram</option>
                <option value="kilogram">Kilogram</option>
                <option value="ounce">Ounce</option>
                <option value="pound">Pound</option>
            </select>

            <button type="submit">Convert</button>
        </form>
        <div class="result">
            {{RESULT}}
        </div>
        <a href="/">← Back to converters</a>

    </main>
</body>

</html>
